<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b0933">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>We're Going on a Goon Hunt! - a spooky tap-along story game</title>
<link rel="icon" href="data:,">
<!--
  We're Going on a Goon Hunt! — a tap-along story game for ages 3–6.
  Fan-made game inspired by the picture book by Michael Rex (Putnam, 2020).
  Single self-contained file: all art is inline SVG/CSS, all sound is Web Audio API,
  read-aloud uses the browser's built-in speechSynthesis. No network needed.
-->
<style>
:root{--purple:#1b0933;--orange:#ff8a1f;--slime:#7ee03a;--moon:#ffe066;--pink:#ff8fd0;--ink:#fff8e6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0d0418;color:var(--ink);
  font-family:"Comic Sans MS","Chalkboard SE","Comic Neue","Marker Felt",ui-rounded,system-ui,sans-serif;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font-family:inherit}
#stage{position:relative;margin:0 auto;width:100%;max-width:560px;height:100vh;height:100dvh;display:flex;flex-direction:column;
  background:radial-gradient(ellipse at 50% 0%,#3d1766 0%,#1b0933 60%,#12061f 100%);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow:hidden}
@media (min-width:561px){#stage{box-shadow:0 0 80px #000c;border-left:3px solid #3d1766;border-right:3px solid #3d1766}}
#top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px 6px;flex:0 0 auto}
.tools{display:flex;gap:12px}
.icon-btn{position:relative;width:64px;height:64px;border-radius:20px;border:3px solid #ffffff55;background:#2a1046;
  font-size:30px;line-height:1;color:#fff;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;padding:0}
.icon-btn.off::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:6px;margin-top:-3px;background:#ff4f6a;border-radius:3px;transform:rotate(-40deg);box-shadow:0 0 0 2px #2a1046}
#tally{height:64px;min-width:64px;padding:0 16px;border-radius:32px;background:#2a1046;border:3px solid #7ee03a99;
  font-size:26px;display:flex;align-items:center;gap:8px;font-weight:bold;white-space:nowrap}
#tally.bump{animation:bump .7s}
#scene{position:relative;flex:1 1 auto;min-height:0;touch-action:none;overflow:hidden;transition:opacity .22s}
#scene.quake{animation:quake .6s}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#text{flex:0 0 auto;margin:6px 10px 0;padding:8px 40px 8px 14px;border-radius:22px;background:#160828ee;border:3px solid #ffe06655;
  text-align:center;cursor:pointer;position:relative;transition:opacity .22s;min-height:64px}
#text p{margin:2px 0;line-height:1.22}
#text .spk{position:absolute;right:8px;top:8px;font-size:22px;opacity:.7;pointer-events:none}
.big{font-size:clamp(21px,5.8vw,32px);font-weight:bold;color:var(--moon)}
.small{font-size:clamp(17px,4.5vw,24px)}
.sw{color:var(--slime);font-weight:bold;font-size:clamp(22px,6vw,32px)}
.chant{font-size:clamp(18px,5vw,28px);font-weight:bold}
.chant .w{color:#9f86c0;transition:color .15s,transform .15s;display:inline-block}
.chant .w.lit{color:#fff}
.chant .w.now{color:var(--slime);transform:scale(1.18)}
.chant .w.sc.lit{color:var(--orange)}
#actions{flex:0 0 auto;min-height:104px;display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 12px 12px;flex-wrap:nowrap;transition:opacity .22s}
.btn{min-height:76px;min-width:64px;padding:10px 26px;border-radius:40px;border:4px solid #fff;font-size:clamp(22px,6vw,30px);font-weight:bold;
  color:#2a0b3d;background:linear-gradient(#ffd25a,#ff8a1f);box-shadow:0 6px 0 #a34b00,0 0 24px #ff8a1f88;cursor:pointer;touch-action:manipulation;max-width:100%;line-height:1.1}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a34b00}
.btn.green{background:linear-gradient(#c8ff8a,#46c21e);box-shadow:0 6px 0 #23700c,0 0 24px #7ee03a88}
.btn.pink{background:linear-gradient(#ffd6f0,#ff5fb8);box-shadow:0 6px 0 #a0306f,0 0 24px #ff8fd088}
.btn.pulse{animation:pulse 1.1s ease-in-out infinite}
.btn.sm{font-size:clamp(19px,5vw,26px);padding:6px 4px;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:26px}
.btn.sm .e{font-size:28px;line-height:1.1}
.prog{width:100%;max-width:460px}
.hint{text-align:center;font-size:clamp(18px,5vw,26px);font-weight:bold;margin-bottom:8px;color:#fff}
.bar{height:34px;border-radius:17px;background:#2a1046;border:3px solid #ffffff77;position:relative;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,#7ee03a,#ffe066);border-radius:17px;transition:width .4s}
.pop{position:absolute;transform:translate(-50%,-50%);font-size:clamp(28px,8vw,46px);font-weight:900;color:#ffe066;
  -webkit-text-stroke:2px #3a1466;text-shadow:0 4px 0 #3a1466,0 0 16px #ff8a1f;white-space:nowrap;pointer-events:none;animation:popword 1.15s ease-out forwards;z-index:5}
.echo-pop{position:absolute;left:4%;right:4%;top:26%;text-align:center;font-size:clamp(22px,6.4vw,36px);font-weight:900;color:#ffc8ea;line-height:1.15;
  -webkit-text-stroke:1.5px #5a1046;text-shadow:0 3px 0 #5a1046,0 0 14px #ff5fb8;pointer-events:none;z-index:6;animation:echopop 1.9s ease-out forwards}
@keyframes echopop{0%{opacity:0;transform:scale(.6)}14%{opacity:1;transform:scale(1.08)}24%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
#stage.fading #scene,#stage.fading #text,#stage.fading #actions{opacity:0}
#rotate{display:none;position:fixed;inset:0;z-index:50;background:#1b0933;color:#fff;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:26px;padding:20px}
#rotate .ico{font-size:64px}
@media (orientation:landscape) and (max-height:500px){#rotate{display:flex}}
@media (max-height:700px){
  #actions{min-height:90px;padding:6px 10px 8px}
  .btn{min-height:68px;font-size:clamp(20px,5.4vw,26px)}
  .big{font-size:clamp(19px,5.2vw,26px)} .small{font-size:clamp(15px,4.2vw,20px)} .chant{font-size:clamp(16px,4.5vw,22px)}
  #text{padding:6px 38px 6px 12px}
}
/* ---------- SVG art & animation ---------- */
#svg *{pointer-events:none}
#svg [data-act],#svg [data-act] *{pointer-events:auto;cursor:pointer}
#svg .locked [data-act],#svg .locked [data-act] *{pointer-events:none}
.ttl{font-weight:900;fill:#ffe066;stroke:#3a1466;stroke-width:7px;paint-order:stroke;stroke-linejoin:round}
.ttl2{fill:#7ee03a}
.bob,.hop,.shake1,.shake2,.runbob,.idle,.tgt,.fam-act,.blink,.floaty,.wobble,.pk,.fd,.dancer,.partydance,.booPop,.spin,.wl,.wr,.garmL,.garmR,.wag,.rise,.drift,.twinkle,.flyby,.walkin,.snuggle,.hl,.zoom,.fall,.mon,.doortgt{transform-box:fill-box}
.bob{animation:bob .55s ease-in-out infinite alternate}
.hop{transform-origin:50% 100%;animation:hop .7s ease-in-out infinite}
.shake1{transform-origin:50% 100%;animation:shake1 .3s ease-in-out infinite alternate}
.shake2{transform-origin:50% 100%;animation:shake2 .14s linear infinite alternate}
.runbob{animation:runbob .18s ease-in-out infinite alternate}
.fam-move{transition:transform .55s cubic-bezier(.3,1.4,.5,1)}
.fam-act{transform-origin:50% 100%}
.fam-act.jump{animation:jump .65s ease-out}
.fam-act.duck{animation:duck .65s ease-out}
.walkin{animation:walkin 2.6s ease-out both}
.idle{transform-origin:center;animation:idle 2.2s ease-in-out infinite alternate}
.tgt{transform-origin:center}
.tgt.poof{animation:poof .45s ease-in forwards}
.tgt.fly{animation:flyaway .8s ease-in forwards}
.tgt.stomped{animation:stomped .4s ease-out forwards}
.tgt.puff{animation:puffaway .7s ease-in forwards}
.doortgt{transform-origin:center}
.doortgt.whack{animation:whack .35s}
.blink{transform-origin:center;animation:blink 3.6s infinite}
.floaty{animation:floaty 2.2s ease-in-out infinite alternate}
.wobble{transform-origin:center;animation:wobble 1.8s ease-in-out infinite alternate}
.twinkle{animation:twinkle 2.4s ease-in-out infinite alternate}
.pk{transform-origin:50% 100%;animation:peek 2.6s ease-in-out infinite}
.mon.hint .pk{animation:hintwig .45s ease-in-out infinite alternate}
.fd{transform-origin:50% 100%;animation:foundpop .6s cubic-bezier(.3,1.7,.5,1)}
.mon{transform-origin:50% 100%}
.mon.again{animation:dance .7s}
.dancer{transform-origin:50% 100%}
.dancer.dance{animation:dance .8s ease-in-out}
.partydance{transform-origin:50% 100%;animation:partydance .9s ease-in-out infinite alternate}
.booPop{transform-origin:50% 100%;animation:boopop .7s cubic-bezier(.3,1.8,.5,1)}
.spin{transform-origin:center;animation:spin 9s linear infinite}
.wl{transform-origin:100% 40%;animation:flapL .22s ease-in-out infinite alternate}
.wr{transform-origin:0% 40%;animation:flapR .22s ease-in-out infinite alternate}
.garmL{transform-origin:100% 100%;animation:waveL .6s ease-in-out infinite alternate}
.garmR{transform-origin:0% 100%;animation:waveR .6s ease-in-out infinite alternate}
.wag{transform-origin:100% 100%;animation:wag .3s ease-in-out infinite alternate}
.rise{animation:rise 3.2s ease-in infinite}
.drift{animation:drift 7s ease-in-out infinite alternate}
.flyby{animation:flyby 9s linear infinite}
.snuggle{transform-origin:50% 100%;animation:snuggle .5s ease-in-out infinite alternate}
.hl{transform-origin:center;animation:hl .8s ease-in-out infinite alternate}
.zoom{animation:zoom .4s linear infinite}
.fall{animation:fall 3.5s linear infinite}
.door{transform-box:fill-box;transform-origin:0% 50%;transition:transform .55s cubic-bezier(.3,1.6,.5,1)}
.door.open1{transform:scaleX(.74) skewY(-5deg)}
.door.open2{transform:scaleX(.46) skewY(-9deg)}
.door.open3{transform:scaleX(.14) skewY(-13deg)}
@keyframes bob{to{transform:translateY(-5px)}}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-16px) rotate(-4deg)}}
@keyframes shake1{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
@keyframes shake2{from{transform:translateX(-2px) rotate(-3.5deg)}to{transform:translateX(2px) rotate(3.5deg)}}
@keyframes runbob{to{transform:translateY(-9px)}}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-70px)}70%{transform:translateY(0) scaleY(.9)}}
@keyframes duck{0%,100%{transform:scaleY(1)}40%,60%{transform:scaleY(.6)}}
@keyframes walkin{from{transform:translateX(-430px)}to{transform:translateX(0)}}
@keyframes idle{from{transform:translateY(-3px) rotate(-3deg)}to{transform:translateY(3px) rotate(3deg)}}
@keyframes poof{0%{transform:scale(1);opacity:1}40%{transform:scale(1.25)}100%{transform:scale(0) rotate(40deg);opacity:0}}
@keyframes flyaway{to{transform:translate(140px,-260px) scale(.5) rotate(25deg);opacity:0}}
@keyframes stomped{0%{transform:scale(1.2)}100%{transform:scale(.7);opacity:.12}}
@keyframes puffaway{to{transform:translateX(120px) scale(1.5);opacity:0}}
@keyframes whack{50%{transform:scale(.94) rotate(-2deg)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes floaty{to{transform:translateY(-10px)}}
@keyframes wobble{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes twinkle{from{opacity:.25}to{opacity:1}}
@keyframes peek{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px) rotate(2deg)}}
@keyframes hintwig{from{transform:rotate(-10deg) scale(1.08)}to{transform:rotate(10deg) scale(1.08)}}
@keyframes foundpop{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes dance{0%,100%{transform:rotate(0) translateY(0)}25%{transform:rotate(-14deg) translateY(-18px)}50%{transform:rotate(0) translateY(0) scale(1.1,.9)}75%{transform:rotate(14deg) translateY(-18px)}}
@keyframes partydance{from{transform:rotate(-5deg) translateY(0)}to{transform:rotate(5deg) translateY(-8px)}}
@keyframes boopop{0%{transform:scale(.3)}100%{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flapL{to{transform:rotate(28deg)}}
@keyframes flapR{to{transform:rotate(-28deg)}}
@keyframes waveL{to{transform:rotate(25deg)}}
@keyframes waveR{to{transform:rotate(-25deg)}}
@keyframes wag{to{transform:rotate(-25deg)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-110px);opacity:0}}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
@keyframes flyby{0%{transform:translateX(-120px)}100%{transform:translateX(560px)}}
@keyframes snuggle{to{transform:scaleY(1.03) translateY(-2px)}}
@keyframes hl{to{transform:scale(1.12)}}
@keyframes zoom{from{transform:translateX(0);opacity:.8}to{transform:translateX(50px);opacity:0}}
@keyframes fall{from{transform:translateY(-60px) rotate(0)}to{transform:translateY(480px) rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes popword{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}22%{transform:translate(-50%,-50%) scale(1.2);opacity:1}100%{transform:translate(-50%,-140%) scale(1);opacity:0}}
@keyframes bump{30%{transform:scale(1.35) rotate(-6deg)}60%{transform:scale(.95)}}
@keyframes quake{0%,100%{transform:translate(0)}20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,2px)}80%{transform:translate(6px,-2px)}}
/* ---------- r3: navigation, confirm, prompts, Dracula, ending ---------- */
#top .left{display:flex;gap:10px}
.icon-btn.hide{visibility:hidden}
@media (max-width:430px){ .icon-btn{width:54px;height:54px;font-size:26px;border-radius:17px} #tally{height:54px;padding:0 10px;font-size:21px;min-width:54px} #top{gap:6px;padding:6px 8px 4px} .tools,#top .left{gap:7px} }
@media (max-width:350px){ .icon-btn{width:48px;height:48px;font-size:23px} #tally{font-size:18px;padding:0 8px} }
#confirm{position:absolute;inset:0;z-index:40;background:#0d0418cc;display:flex;align-items:center;justify-content:center}
#confirm[hidden]{display:none}
.cbox{background:#2a1046;border:4px solid #ffe066;border-radius:32px;padding:18px 22px 22px;text-align:center;box-shadow:0 10px 40px #000a}
.cbox.cin{animation:boopop .35s cubic-bezier(.3,1.8,.5,1)}
.cq{font-size:56px;line-height:1.1;margin-bottom:12px}
.crow{display:flex;gap:26px;justify-content:center}
.cbtn{width:118px;height:118px;border-radius:50%;border:5px solid #fff;font-size:58px;cursor:pointer;display:grid;place-items:center;padding:0;touch-action:manipulation}
.cbtn.yes{background:linear-gradient(#c8ff8a,#46c21e);box-shadow:0 7px 0 #23700c}
.cbtn.no{background:linear-gradient(#ffb3c0,#ff4f6a);box-shadow:0 7px 0 #a0203a}
.cbtn:active{transform:translateY(4px)}
.saying{animation:saying .7s ease-out !important}
@keyframes saying{0%{transform:scale(1)}35%{transform:scale(1.16) rotate(-2deg);filter:brightness(1.25)}70%{transform:scale(.97)}100%{transform:scale(1)}}
#svg .saying{transform-box:fill-box;transform-origin:center}
.who{font-size:clamp(15px,4vw,19px);color:#ffc8ea;margin:0 !important}
.echo-pop.soft{color:#dfe3ff;text-shadow:0 3px 0 #2a2a6a,0 0 14px #9fb0ff}
.btn.big2{font-size:clamp(26px,7vw,36px);padding:14px 34px}
.bp{transform-box:fill-box;opacity:0}
.bp1{animation:bp1 1.3s ease-out}.bp2{animation:bp2 1.3s ease-out .05s}.bp3{animation:bp3 1.3s ease-out .1s}
@keyframes bp1{0%{opacity:1;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(-60px,-50px) scale(1)}}
@keyframes bp2{0%{opacity:1;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(55px,-60px) scale(1)}}
@keyframes bp3{0%{opacity:1;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(5px,-80px) scale(1)}}
.flick{animation:flick 1.6s ease-in-out infinite alternate}
@keyframes flick{0%{opacity:.75}50%{opacity:1}53%{opacity:.6}56%{opacity:1}100%{opacity:.85}}
.hearts{opacity:0;transition:opacity .4s}.hearts.show{opacity:1}
.bedfam.giggle{transform-box:fill-box;transform-origin:50% 100%;animation:giggle .22s ease-in-out 6 alternate}
@keyframes giggle{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.uniHi{transform-box:fill-box;transform-origin:50% 100%}.uniHi.hop1{animation:jump .6s ease-out}
.lightsout{animation:lightsout 2.4s ease-in forwards}
@keyframes lightsout{from{opacity:0}to{opacity:.62}}
/* peek steps: only the lit features show; arms/claws never lit before the reveal */
.glit .garmL,.glit .garmR{display:none}
@media (prefers-reduced-motion:reduce){.shake2{animation-duration:.4s}.spin{animation:none}}
</style>
</head>

<!-- Shared SVG gradients/filters (invisible but not display:none, so references work everywhere) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gSky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="440"><stop offset="0" stop-color="#160629"/><stop offset=".6" stop-color="#3d1766"/><stop offset="1" stop-color="#6a2a8a"/></linearGradient>
    <linearGradient id="gSwampSky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0" stop-color="#0b1a24"/><stop offset=".7" stop-color="#1f3d3a"/><stop offset="1" stop-color="#2f5b4a"/></linearGradient>
    <linearGradient id="gForestSky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="320"><stop offset="0" stop-color="#0a0c26"/><stop offset="1" stop-color="#2b1f5a"/></linearGradient>
    <linearGradient id="gWater" gradientUnits="userSpaceOnUse" x1="0" y1="160" x2="0" y2="440"><stop offset="0" stop-color="#4b8a3e"/><stop offset="1" stop-color="#1b3a1e"/></linearGradient>
    <radialGradient id="gMoon"><stop offset="0" stop-color="#fffbe0"/><stop offset=".55" stop-color="#ffe680"/><stop offset="1" stop-color="#ffd23f"/></radialGradient>
    <radialGradient id="gGlow"><stop offset="0" stop-color="#fff3a0" stop-opacity=".55"/><stop offset="1" stop-color="#fff3a0" stop-opacity="0"/></radialGradient>
    <linearGradient id="gBeam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff7b0" stop-opacity=".55"/><stop offset="1" stop-color="#fff7b0" stop-opacity="0"/></linearGradient>
    <radialGradient id="gTunnel" gradientUnits="userSpaceOnUse" cx="200" cy="240" r="210"><stop offset="0" stop-color="#000"/><stop offset=".55" stop-color="#0d0805"/><stop offset="1" stop-color="#2a1a10"/></radialGradient>
    <radialGradient id="gFog"><stop offset="0" stop-color="#f3f0ff" stop-opacity=".97"/><stop offset=".6" stop-color="#d9d2f5" stop-opacity=".88"/><stop offset="1" stop-color="#d9d2f5" stop-opacity="0"/></radialGradient>

    <filter id="fGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

<div id="stage" class="at-title">
  <div id="top">
    <div class="left">
      <button class="icon-btn navb hide" id="backBtn" data-act="back" aria-label="Go back one step">⬅️</button>

</div>
<div id="rotate"><div class="ico">📱↻</div><p>Turn your phone upright to play!</p></div>
<script>
"use strict";
/* =====================================================================
   SOUND ENGINE: every sound is synthesized with the Web Audio API.
   To swap in real recordings later: load files into AudioBuffers
   (e.g. fetch('sounds/gurgle.mp3') -> ctx.decodeAudioData) and play them
   inside Snd.play(name) instead of calling the synth recipe below.

const Snd = {

    if(!this.on||!this.ok||!text) return;

  say(id){ if(!this.on) return; const L=VO_LINES[id]; if(L) TTS.say(L[0],{pitch:L[1]==='E'?1.5:1.1,rate:L[1]==='E'?1:.95}); },
  /* Play a run of lines. items: [{id, q:'bar'|'beat'|'half', delay, gap, rate, gain, on(t,dur)}].
     on() fires when the line starts (also when voices are off), so text/pops stay in step. */
  busy(){ return this.live.length>0; },
  seq(items,{keep=false,end=null}={}){
    if(!keep) this.stop();
    if(this.pre){ items=[{id:this.pre,gap:.12},...items.map((it,i)=>i?it:Object.assign({},it,{delay:0}))]; this.pre=null; }
    const tok=this.tok;
    if(!this.ctx){ if(this.on) TTS.say(items.map(i=>(VO_LINES[i.id]||[''])[0]).join(' ')); items.forEach(i=>i.on&&i.on(0,this.dur(i.id))); if(end) later(()=>{ if(tok===this.tok) end(); },items.reduce((a,i)=>a+this.dur(i.id)*1000+(i.delay||0)*1000,300)); return; }

        if(it.delay) t+=it.delay;
        if(it.q) t=this.q(t,it.q);

        if(this.on){ if(this.buf[it.id]) this.src(it.id,at,it); else later(()=>{ if(tok===this.tok) this.say(it.id); },ms); }
        if(it.on) later(()=>{ if(tok===this.tok) it.on(at,d); },ms);

      });
      if(end) later(()=>{ if(tok===this.tok) end(); },Math.max(0,(t-this.now())*1000));
    });
  },
  shout(id,unit='half'){ // a tap-triggered word: on the next half-beat, never stacked on itself
    if(!this.on) return; const n=this.now(); if(n<this.shoutEnd-.12) return;
    if(!this.ctx||!this.buf[id]){ if(!this.ctx||this.bad[id]){ this.say(id); this.shoutEnd=n+this.dur(id); } return; }
    this.shoutEnd=this.src(id,unit==='now'?n+.02:this.q(n,unit))||n;

  bedTo(name,fade=.5){ // switch the looping bed (null = silence)

      s.connect(g); g.connect(this.duck); s.start(t); this.bed={s,g}; this.grid={t0:t,beat:B.beat};
    };
    if(this.buf[id]) start(); else if(this.ready&&this.ready[id]) this.ready[id].then(start);
  },
};

const $=s=>document.querySelector(s);
const stage=$('#stage'), sceneEl=$('#scene'), svg=$('#svg'), textEl=$('#text'), actEl=$('#actions');
const S={scene:'title',ob:0,phase:'',prog:0,found:new Set(),gstep:0,run:0,bstep:0,busy:false,say:'',replay:null,pr:null,idleT:0,confirm:false};
const timers=[]; const later=(fn,ms)=>{ timers.push(setTimeout(fn,ms)); };
const clearTimers=()=>{ timers.forEach(clearTimeout); timers.length=0; clearTimeout(S.idleT); S.pr=null; };
function setText(html,say){ textEl.innerHTML=html+'<span class="spk" aria-hidden="true">🔊</span>'; S.say=say||textEl.textContent; }
function setActions(html){ actEl.innerHTML=html; }
function restartAnim(el,cls){ if(!el) return; el.classList.remove(cls); void el.getBoundingClientRect(); el.classList.add(cls); }
function pop(text,e){
  const r=sceneEl.getBoundingClientRect(); const d=document.createElement('div'); d.className='pop'; d.textContent=text;
  let x=(e&&e.clientX!=null)?e.clientX-r.left:r.width/2, y=(e&&e.clientY!=null)?e.clientY-r.top:r.height*.4;
  const half=Math.min(r.width/2-6, text.length*11+12);
  x=Math.max(half,Math.min(r.width-half,x)); y=Math.max(40,Math.min(r.height-30,y));
  d.style.left=x+'px'; d.style.top=y+'px'; sceneEl.appendChild(d); setTimeout(()=>d.remove(),1200);
}
function updateTally(bump){ $('#tally b').textContent=S.found.size; if(bump) restartAnim($('#tally'),'bump'); }

/* ---------- Navigation: history of story steps, Go Back, Start Over ---------- */
const HIST=[];
const snap=()=>({scene:S.scene,ob:S.ob,gstep:S.gstep,run:S.run,bstep:S.bstep});
function pushHist(){ const s=snap(), top=HIST[HIST.length-1]; if(!top||JSON.stringify(top)!==JSON.stringify(s)) HIST.push(s); }
function updateNav(){
  const t=S.scene==='title';
  $('#homeBtn').classList.toggle('hide',t);
  $('#backBtn').classList.toggle('hide',t||(!HIST.length&&!(S.scene==='obstacle'&&S.phase)));
}
function go(scene,opts={},{push=true}={}){
  if(S.busy) return; S.busy=true; clearTimers(); Snd.stopParty(); VO.stop(); closeConfirm();
  if(push) pushHist();
  stage.classList.add('fading');
  setTimeout(()=>{
    Object.assign(S,{scene,phase:'',prog:0},opts);
    sceneEl.querySelectorAll('.pop,.echo-pop').forEach(p=>p.remove()); sceneEl.classList.remove('quake');
    stage.classList.toggle('at-title',scene==='title');
    try{ render(); }catch(err){ console.error(err); }
    stage.classList.remove('fading'); S.busy=false; updateNav();
  },230);
}
function goBack(){
  if(S.busy) return; P('whoosh');
  if(S.scene==='obstacle'&&S.phase&&S.phase!=='shouted'){ VO.pre='nav_back'; go('obstacle',{ob:S.ob},{push:false}); return; } // mid-obstacle: restart this obstacle
  const s=HIST.pop(); if(!s) return;
  VO.pre='nav_back'; go(s.scene,s,{push:false});
}
function openConfirm(){
  if(S.confirm||S.busy) return; S.confirm=true; S.prSave=S.pr; clearTimers(); VO.stop(); Snd.stopParty();
  const c=$('#confirm'); c.hidden=false; restartAnim(c.querySelector('.cbox'),'cin');
  VO.seq([{id:'nav_restart_q',delay:.1}]);
}
function closeConfirm(){ S.confirm=false; const c=$('#confirm'); if(c) c.hidden=true; }
function restartGame(){ HIST.length=0; S.found.clear(); updateTally(); go('title',{},{push:false}); }
function render(){ ({title:rTitle,chant:rChant,obstacle:rObstacle,goon:rGoon,run:rRun,stairs:rStairs,bedroom:rBedroom,friends:rFriends,party:rParty,night:rNight})[S.scene](); }

const lineTxt=id=>(VO_LINES[id]||[''])[0];
function echoPop(id,cls=''){ // the echo kid's reply appears as a pink speech bubble
  const d=document.createElement('div'); d.className='echo-pop '+cls; d.textContent=lineTxt(id);
  sceneEl.appendChild(d); setTimeout(()=>d.remove(),1900);
}
function play(items){ S.replay=items; VO.seq(items); }

/* ---------- Spoken button prompts ----------
   Every step ends with the leader telling her what to press (the button
   bounces while its prompt is spoken). If nothing is tapped for 7 s the main
   prompt repeats once. Tapping the words box replays the prompt. */
function flashBtn(a){
  if(!a) return; const b=actEl.querySelector(`[data-act="${a}"]`)||svg.querySelector(`[data-act="${a}"]`);
  if(!b) return; restartAnim(b,'saying'); setTimeout(()=>b.classList.remove('saying'),750);
}
const pItem=(id,a,q='beat',x={})=>Object.assign({id,q,on:()=>flashBtn(a)},x);
function scene(lines,prompts,{gap=0}={}){
  const pr={items:prompts.map(([id,a,x])=>pItem(id,a,'beat',x)),main:prompts[prompts.length-1],rep:false,armed:false};
  if(gap&&pr.items[0]) pr.items[0].delay=gap;
  S.pr=pr; S.replay=lines;
  VO.seq([...lines,...pr.items],{end:()=>{ if(S.pr===pr) armIdle(); }});
}
function armIdle(ms=7000){ const p=S.pr; if(!p||p.rep) return; p.armed=true; clearTimeout(S.idleT); S.idleT=setTimeout(idleFire,ms); }
function idleFire(){
  const p=S.pr; if(!p||p.rep||!p.armed||S.confirm) return;
  if(VO.busy()){ S.idleT=setTimeout(idleFire,1500); return; }
  p.rep=true; const [id,a]=p.main; VO.seq([pItem(id,a,null)]);
}
function sayPrompt(){
  const p=S.pr; if(!p){ if(S.replay) VO.seq(S.replay); return; }
  VO.seq(p.items.map((it,i)=>Object.assign({},it,{q:i?'beat':null,delay:0})),{end:()=>{ if(S.pr===p&&!p.rep) armIdle(); }});
}

function rTitle(){
  VO.bedTo(null);
  svg.innerHTML=ART.title();
  setText('<p class="big">A spooky tap-along story!</p><p class="small">Listen, tap, and find the hiding monsters.</p>',"We're going on a goon hunt! A spooky tap-along story. Listen, tap, and find the hiding monsters!");
  setActions('<button class="btn pulse" data-act="start">Start the Hunt! 🎃</button>');
  const lines=[{id:'title_01'}], prompts=[['p_goon','tgoon'],['p_start','start']];
  if(VO.ctx&&VO.ctx.state==='running') scene(lines,prompts); // after "Hunt Again"; first visit waits for a tap
  else { S.replay=lines; S.pr={items:prompts.map(([id,a])=>pItem(id,a)),main:prompts[1],rep:false,armed:false}; S.firstTitle=true; }
}
function rChant(){
  const o=OBST[S.ob];
  VO.bedTo('march');
  svg.innerHTML=ART.trail(S.ob)+famG({lvl:fear(S.ob)},0,.78);
  const lines=[...CHANT,o.scared];
  const html=lines.map((l,li)=>'<span class="ln">'+l.split(' ').map(w=>`<span class="w${li===3?' sc':''}">${w}</span>`).join(' ')+'</span>').join('<br>');
  setText(`<p class="chant">${html}</p>`,lines.join(' '));
  setActions(`<button class="btn green" data-act="notscared">${o.btn}</button>`);
  const ln=[...textEl.querySelectorAll('.ln')];
  const light=(k,d)=>{ // words light up in time with the leader's line
    const ws=[...ln[k].querySelectorAll('.w')];
    ws.forEach((w,i)=>later(()=>{ textEl.querySelectorAll('.w.now').forEach(x=>x.classList.remove('now')); w.classList.add('lit','now'); if(!VO.bed) P(i===0?'drumHi':'drum'); },i*d*850/ws.length));
    later(()=>ws.forEach(w=>w.classList.remove('now')),d*1000);
  };
  const L=['chant_L1','chant_L2','chant_L3','scared_L_'+o.id], E=['chant_E1','chant_E2','chant_E3'];
  const items=[];
  L.forEach((id,k)=>{
    items.push({id,q:'bar',delay:k?0:.3,on:(t,d)=>light(k,d)});
    if(E[k]) items.push({id:E[k],q:'bar',on:()=>echoPop(E[k])});
  });
  const last=items[items.length-1];
  last.on=(t,d)=>{ light(3,d); later(()=>{ const b=actEl.querySelector('.btn'); b&&b.classList.add('pulse'); },d*1000); };
  scene(items,[['p_scared_'+o.id,'notscared']]); // the kid's tap on the button is the echo for the last line
}
function rObstacle(){
  const o=OBST[S.ob], A=ART[o.id]();

        [['p_over','over'],['p_under','under'],['p_through','through']]);

function startThrough(){
  if(S.phase==='go'||S.phase==='done') return; const o=OBST[S.ob]; clearTimers(); S.phase='go'; S.prog=0;
  const t=$('#tgts'); t&&t.classList.remove('locked');

  P('drumHi'); scene([{id:'through_01'}],[['hint_'+o.id,null]]);

function moveFam(dx){ const m=svg.querySelector('.fam-move'); if(m) m.style.transform=`translateX(${dx}px)`; }
function famAct(cls){ restartAnim(svg.querySelector('.fam-act'),cls); }
function hitTarget(el,e){
  if(S.scene!=='obstacle'||S.phase!=='go') return;
  const o=OBST[S.ob];
  if(o.id==='house'){ S.prog++; const d=$('#door'); d&&d.setAttribute('class','door open'+Math.min(S.prog,3)); restartAnim(el,'whack'); if(S.prog>=o.n) el.removeAttribute('data-act'); }
  else { el.removeAttribute('data-act'); el.classList.add(o.gone); S.prog++; }
  P(o.snd); pop(o.word,e); VO.shout('word_'+o.id);
  moveFam(-70+140*S.prog/o.n);
  const f=$('#fill'); if(f){ f.style.width=(100*S.prog/o.n)+'%'; f.parentNode.setAttribute('aria-valuenow',S.prog); }
  if(S.prog>=o.n){ S.phase='done'; clearTimeout(S.idleT); S.pr=null; later(o.id==='house'?doorDone:throughDone,700); }
}
function throughDone(){
  const o=OBST[S.ob]; P('chime'); famAct('jump');

  setActions(`<button class="btn green pulse" data-act="next">Keep hunting! ➜</button>`);
  const items=[{id:'done_01'},{id:'done_E',q:'beat',on:()=>echoPop('done_E')}];
  if(missed) items.push({id:'psst_hiding',q:'bar'});
  scene(items,missed?[['p_find','monster'],['p_next','next']]:[['p_next','next']]);
  if(missed){ const m=svg.querySelector('.mon.peek'); m&&m.classList.add('hint'); }

function doorDone(){

  setActions(`<button class="btn pink pulse" data-act="enter">Who’s in there? 👀</button>`);
  P('heartbeat'); later(()=>P('heartbeat'),700);
  const items=[{id:'door_01'}]; if(missed) items.push({id:'psst_window',q:'bar'});
  scene(items,missed?[['p_find','monster'],['p_enter','enter']]:[['p_enter','enter']]);

function findMonster(el,e){
  const id=el.dataset.id;
  if(!S.found.has(id)){
    S.found.add(id); el.classList.remove('peek','hint'); el.classList.add('found');
    el.setAttribute('aria-label',MON[id].name);
    el.innerHTML=`<circle r="44" fill="transparent"/>${MON[id].found(true)}`;
    P('pop'); later(()=>P('giggle'),120); pop(MON[id].say,e); updateTally(true);
    VO.seq([{id:'found_'+id}],{end:()=>{ if(S.pr&&!S.pr.rep) armIdle(5000); }});
  } else { P('giggle'); pop(MON[id].say,e); restartAnim(el,'again'); }
}
const GOON_TXT=["What's that? Something is in the dark…","A bumpy, bald head!","Big, green ears!","Little, beady eyes!","IT'S A GOON! BOO!"];
function rGoon(){
  const st=S.gstep;
  svg.innerHTML=ART.goonScene(st);
  if(st<4){
    VO.bedTo('suspense');
    setText(`<p class="big">${GOON_TXT[st]}</p>`,GOON_TXT[st]);
    setActions('<button class="btn pulse" data-act="peek">Peek! 👀</button>');
    P(st===0?'heartbeat':'sting');
    const n=st+1;
    scene(st===0?[{id:'goon_01',q:'bar'}]:[{id:`goon_0${n}`,q:'bar'},{id:`goon_0${n}E`,q:'bar',on:()=>echoPop(`goon_0${n}E`)}],[['p_peek','peek']]);
  } else {
    VO.bedTo(null,.05); // the music cuts out at the reveal
    setText(`<p class="big">${GOON_TXT[4]}</p><p class="small">Everybody run!</p>`,"It's a GOON! Boo! Everybody run!");
    setActions('<button class="btn pink pulse" data-act="run">RUN!!! 💨</button>');
    P('boo'); later(()=>P('scream'),500); restartAnim(sceneEl,'quake');
    scene([{id:'goon_05',delay:.15},{id:'goon_05E',on:()=>echoPop('goon_05E')}],[['p_run','run']]);
  }
}
const RUN_TXT={house:"Quick! Back through the haunted house!",graveyard:"Back through the graveyard!",forest:"Back through the forest!",tunnel:"Back through the tunnel!",swamp:"Back through the swamp!",pumpkin:"Back through the pumpkin patch!"};
function rRun(){
  const id=RUNS[S.run], o=OBST.find(x=>x.id===id), s=.66;
  VO.bedTo('escape');
  const runners=`<g transform="translate(${(200+124*s).toFixed(1)} 428) scale(${-s} ${s})"><g class="runbob">${family({lvl:2})}</g></g>`;
  const lines=[300,340,380].map((y,i)=>`<g class="zoom" style="animation-delay:${i*-.13}s"><path d="M${300+i*10} ${y} h40" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".7"/></g>`).join('');
  const chaser=`<g transform="translate(352 236) scale(.3)">${goon()}</g><g transform="translate(300 160)"><rect x="-62" y="-22" width="124" height="34" rx="14" fill="#fff"/><path d="M30 12 l14 14 l-2 -14Z" fill="#fff"/><text y="1" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a1046">Wait! Let's play!</text></g>`;
  svg.innerHTML=`<g>${ART[id]().bg}</g>${chaser}${runners}${lines}`;
  const w=o.word.replace('!',''), sw=`${w}, ${w.toLowerCase()}!`;
  setText(`<p class="big">${RUN_TXT[id]}</p><p class="sw">${sw}</p>`,`${RUN_TXT[id]} ${sw}`);
  setActions(`<button class="btn pink pulse" data-act="run">RUN! 💨</button>`);
  P('whoosh');
  const items=[{id:'run_'+id,q:'beat'}];
  for(let i=0;i<2;i++) items.push({id:'word_'+id,q:'beat',rate:1.08,on:()=>P(o.snd)}); // rushed, double-time
  if(S.run===0||S.run===3) items.push({id:'goon_wait',q:'beat'});
  scene(items,[['p_run','run']]);
}
function rStairs(){
  VO.bedTo('escape');
  svg.innerHTML=ART.stairs(false);
  setText('<p class="big">Get to the front door!</p><p class="small">Open the door. Up the stairs.</p>','Get to the front door! Open the door. Up the stairs.');
  setActions('<button class="btn pink pulse" data-act="keeprun">Keep running! 💨</button>');
  P('slam'); later(()=>P('steps'),300);
  scene([{id:'stairs_01',delay:.2},
         {id:'stairs_02',q:'beat',on:()=>{ svg.innerHTML=ART.stairs(true); P('creak');
            setText('<p class="big">Oh no! We forgot to shut the door!</p><p class="small">Nooo! Don’t go back in there!</p>','Oh no! We forgot to shut the door! Nooo! Don\'t go back in there!'); }},
         {id:'stairs_E',q:'beat',on:()=>echoPop('stairs_E')}],
        [['p_keeprun','keeprun']]);
}
function rBedroom(){
  VO.bedTo('suspense');
  svg.innerHTML=ART.bedroom('hide');
  setText('<p class="big">Keep running!</p><p class="small">Into the bedroom. Into bed. Under the covers.</p>','Keep running! Into the bedroom. Into bed. Under the covers.');
  setActions('<button class="btn pulse" data-act="peek2">Peek! 🔦</button>');
  P('steps');
  scene([{id:'cover_01',delay:.2},
         {id:'cover_02',q:'bar',on:()=>setText('<p class="big">We’re not going on a goon hunt again!</p>',"We're not going on a goon hunt again!")},
         {id:'cover_E',q:'beat',on:()=>echoPop('cover_E')},
         {id:'cover_03',q:'bar',delay:.3,on:()=>{ svg.innerHTML=ART.bedroom('light'); P('click');
            setText('<p class="big">Wait… who’s holding the flashlight? 🔦</p>',"Wait... who's holding the flashlight?"); }}],
        [['p_peek','peek2']]);
}
function rFriends(){
  VO.bedTo(null,.3);
  svg.innerHTML=ART.bedroom('friends');
  P('boing'); later(()=>P('giggle'),250);
  const say=(who,id)=>setText(`<p class="who">${who}</p><p class="big">${lineTxt(id)}</p>`,lineTxt(id));
  say('The Goon:','goonbed_01');
  setActions('<button class="btn green pulse" data-act="party">Dance party! 🎉</button>');
  scene([{id:'goonbed_01',delay:.3,on:()=>say('The Goon:','goonbed_01')},
         {id:'uni_friend',delay:.25,on:()=>{ say('The littlest unicorn:','uni_friend'); restartAnim(svg.querySelector('.uniHi'),'hop1'); }},
         {id:'goonbed_02',delay:.15,on:()=>{ say('The Goon:','goonbed_02'); svg.querySelectorAll('.hearts').forEach(h=>h.classList.add('show')); P('chime'); }},
         {id:'pop_hee',delay:.1,on:()=>{ P('giggle'); later(()=>P('laugh'),200); setText('<p class="big">Everybody giggles! 😄</p>','Everybody giggles!'); svg.querySelector('.bedfam')&&svg.querySelector('.bedfam').classList.add('giggle'); }}],
        [['p_party','party']]);
}
function rParty(){
  VO.bedTo(null);
  svg.innerHTML=ART.party(S.found);
  const cid='count_'+S.found.size;
  const show=id=>setText(`<p class="big">MONSTER DANCE PARTY! 🎉</p><p class="small">${lineTxt(id)}</p>`,lineTxt('party_02')+' '+lineTxt(cid));
  show('party_02');
  setActions('<button class="btn pulse" data-act="night">Goodnight! 🌙</button>');
  P('cheer'); later(()=>Snd.startParty(),600);
  scene([{id:'party_02',delay:.3,on:()=>show('party_02')},{id:cid,delay:.15,on:()=>show(cid)}],
        [['p_goon','dance'],['p_night','night',{delay:3}]]);
}
function rNight(){
  VO.bedTo(null);
  svg.innerHTML=ART.party(S.found,true);
  setText('<p class="big">Goodnight, Goon. Goodnight, monsters. 🌙</p>','Goodnight, Goon. Goodnight, monsters.');
  setActions('');
  P('chime');
  scene([{id:'night_01',delay:.8},{id:'night_E',delay:.3,on:()=>echoPop('night_E','soft')}],
        [['p_again','restart',{delay:.6}]]);
  later(()=>{ // end card
    if(S.scene!=='night') return;
    setText('<p class="big">The End 💤</p><p class="small">Thanks for hunting!</p>','The End. Thanks for hunting!');
    setActions('<button class="btn green pulse big2" data-act="restart">Hunt Again! 🔁</button>');
  },2600);
}
function dance(el,e){
  restartAnim(el,'dance'); const k=el.dataset.k;
  if(k==='goon'){ P('laugh'); pop('Ha ha ha!',e); VO.shout('goon_laugh','now'); }
  else if(k==='uni'){ P('giggle'); pop('Wheee!',e); VO.shout('uni_whee','now'); }
  else { P('note'); pop(['♪','♫','Woo!','Yay!','Boogie!'][Math.floor(Math.random()*5)],e); }
}

/* ---------- Actions ---------- */
function act(a,el,e){
  switch(a){
    case 'snd': Snd.setOn(!Snd.on); el.classList.toggle('off',!Snd.on); el.setAttribute('aria-pressed',Snd.on); if(Snd.on){ P('pop'); if(S.scene==='party') Snd.startParty(); } else Snd.stopParty(); return;
    case 'voice': VO.setVoice(!VO.on); el.classList.toggle('off',!VO.on); el.setAttribute('aria-pressed',VO.on); if(VO.on) VO.seq([{id:'voice_on'}]); return;
    case 'yes': if(S.confirm){ P('pop'); closeConfirm(); restartGame(); } return;
    case 'no': if(S.confirm){ P('pop'); closeConfirm(); VO.pre='nav_keep';
      // keep her place: mid-obstacle or on the "made it through" screen, nothing is redrawn or lost
      if(S.scene==='obstacle'&&S.phase==='go'){ S.pr=S.prSave; sayPrompt(); }
      else if(S.scene==='obstacle'&&S.phase==='done') (OBST[S.ob].id==='house'?doorDone:throughDone)();
      else go(S.scene,snap(),{push:false}); } return;
    case 'home': if(!S.confirm&&S.scene!=='title') openConfirm(); return;
  }
  if(S.confirm||S.busy) return;
  switch(a){
    case 'read': sayPrompt(); return;
    case 'back': goBack(); return;
    case 'start': P('steps'); go('chant',{ob:0}); break;
    case 'tgoon': P('giggle'); pop('Hee hee!',e); VO.shout('pop_hee','now'); break;
    case 'notscared': {
      if(S.phase==='shouted') break; S.phase='shouted'; clearTimers();
      const o=OBST[S.ob], eid='scared_E_'+o.id; P('cheer'); famAct('jump'); pop(o.btn,e);
      VO.seq([{id:eid}]);
      textEl.querySelectorAll('.w').forEach(w=>{ w.classList.add('lit'); w.classList.remove('now'); });
      later(()=>go('obstacle',{prog:0}),Math.max(1400,VO.dur(eid)*1000+450)); break; }
    case 'over': P('boing'); famAct('jump'); echoPop('over_E'); VO.seq([{id:'over_E'}]); break;
    case 'under': P('buzz'); famAct('duck'); echoPop('under_E'); VO.seq([{id:'under_E'}]); break;
    case 'through': startThrough(); break;
    case 'tgt': hitTarget(el,e); break;
    case 'monster': findMonster(el,e); break;
    case 'next': go('chant',{ob:S.ob+1}); break;
    case 'enter': go('goon',{gstep:0}); break;
    case 'peek': if(S.scene==='goon'&&S.gstep<4){ pushHist(); clearTimers(); VO.stop(); S.gstep++; rGoon(); updateNav(); } break;
    case 'run': {
      if(S.scene==='goon'){ go('run',{run:0}); break; }
      const n=S.run+1; P('whoosh'); if(n>=RUNS.length) go('stairs',{bstep:0}); else go('run',{run:n}); break; }
    case 'keeprun': P('whoosh'); go('bedroom',{bstep:0}); break;
    case 'peek2': go('friends'); break;
    case 'party': P('whoosh'); go('party'); break;
    case 'night': go('night'); break;
    case 'dance': dance(el,e); break;
    case 'restart': restartGame(); break;
  }
}

/* ---------- Input: pointer events (touch + mouse + pen) ---------- */
let pointerDown=false;
stage.addEventListener('pointerdown',e=>{
  pointerDown=true; Snd.init();
  if(S.pr&&S.pr.armed&&!S.pr.rep) armIdle(); // any tap restarts the "no tap" timer
  const el=e.target.closest('[data-act]');
  if(S.firstTitle&&S.scene==='title'&&(!el||el.dataset.act!=='start')){ S.firstTitle=false; if(!el||el.dataset.act==='read'){ scene(S.replay,[['p_goon','tgoon'],['p_start','start']]); if(el) return; } }
  if(!el) return;
  e.preventDefault(); act(el.dataset.act,el,e);
});
// Keyboard (Enter/Space) support: HTML buttons fire click with detail 0
stage.addEventListener('click',e=>{ if(e.detail!==0) return; const el=e.target.closest('[data-act]'); if(el){ Snd.init(); act(el.dataset.act,el,null); } });
stage.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ') return;
  const el=e.target.closest&&e.target.closest('#svg [data-act]'); if(!el) return;
  e.preventDefault(); Snd.init(); act(el.dataset.act,el,null);
});
['pointerup','pointercancel'].forEach(t=>window.addEventListener(t,()=>{ pointerDown=false; }));
// Swipe-to-clear: dragging a finger across vines/bubbles/bats/fog clears them too
sceneEl.addEventListener('pointermove',e=>{
  if(!pointerDown||S.scene!=='obstacle'||S.phase!=='go'||OBST[S.ob].id==='house') return;
  const t=document.elementFromPoint(e.clientX,e.clientY); const el=t&&t.closest&&t.closest('[data-act="tgt"]');
  if(el) act('tgt',el,e);
});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ VO.stop(); if(Snd.ctx) Snd.ctx.suspend().catch(()=>{}); }
  else if(Snd.ctx) Snd.ctx.resume().catch(()=>{});
});

VO.prefetch();
render();
</script>
